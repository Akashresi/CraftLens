name: CraftLens CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-quality:
    name: Backend Lint, Typecheck, Security Audit & Tests (>=80% Cov)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Lint and Format Check (Ruff)
        run: |
          python -m ruff check backend ai-service
          python -m ruff format --check backend ai-service

      - name: Static Type Check (Mypy)
        run: python -m mypy backend/app ai-service

      - name: Security Static Scan (Bandit)
        run: python -m bandit -r backend/app ai-service -ll -q

      - name: Python Dependency Vulnerability Audit (pip-audit)
        run: python -m pip_audit -r backend/requirements.txt --no-deps

      - name: Secret Scan (No hardcoded private keys or live tokens)
        run: |
          ! git grep -nE "BEGIN (RSA|EC|OPENSSH|PGP) PRIVATE KEY|rzp_live_|AIza[0-9A-Za-z_-]{35}" -- ':(exclude).env.example' ':(exclude)docs/*' ':(exclude).github/*'

      - name: Alembic Migrations + Pytest (>=80% Coverage)
        run: |
          cp .env.example .env
          cd backend && python -m alembic upgrade head && cd ..
          python -m pytest backend/tests --cov=backend/app --cov-report=term-missing --cov-fail-under=80 -v

  frontend-quality:
    name: Web & Mobile Typecheck, Lint, Build & Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Buyer Web Checks
        working-directory: buyer-web
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm lint
          pnpm build
          pnpm audit --prod --audit-level=critical

      - name: Admin Web Checks
        working-directory: admin-web
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm lint
          pnpm build
          pnpm audit --prod --audit-level=critical

      - name: Mobile Typecheck
        working-directory: mobile
        run: |
          pnpm install --frozen-lockfile
          npx tsc --noEmit

  docker-build:
    name: Docker Compose Clean Build Verification
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare .env from .env.example
        run: cp .env.example .env

      - name: Validate & Build Docker Compose Stack
        run: |
          docker compose config -q
          docker compose build
